<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation d'une Écluse avec Vannes Visuelles</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      -webkit-user-select: none;
      user-select: none;
    }
    #lock-container {
      position: relative;
      width: 700px;
      height: 300px;
      background: #e0f7fa;
      border: 4px solid #37474f;
      border-radius: 8px;
      overflow: hidden;
    }
    /* Sections d'eau */
    .water {
      position: absolute;
      bottom: 0;
      background-color: #29b6f6;
      transition: height 0.1s linear;
    }
    #water-upstream { left: 0; width: 200px; height: 220px; background-color: #0288d1; }
    #water-chamber { left: 210px; width: 280px; height: 80px; }
    #water-downstream { left: 500px; width: 200px; height: 80px; background-color: #4fc3f7; }

    /* Animation du flux d'eau (Vannes ouvertes) */
    .water-flow {
      position: absolute;
      bottom: 0;
      width: 40px;
      height: 80px;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.7),
        rgba(255, 255, 255, 0.7) 10px,
        rgba(41, 182, 246, 0.5) 10px,
        rgba(41, 182, 246, 0.5) 20px
      );
      display: none;
      z-index: 2;
      animation: flowAnim 0.4s linear infinite;
    }
    #flow-left { left: 210px; }
    #flow-right { left: 500px; }

    @keyframes flowAnim {
      0% { background-position: 0 0; }
      100% { background-position: 0 20px; }
    }
    
    /* Murs et Portes */
    .wall { position: absolute; bottom: 0; width: 10px; height: 250px; background: #78909c; }
    #wall-left { left: 200px; }
    #wall-right { left: 490px; }

    .gate {
      position: absolute;
      bottom: 0;
      width: 10px;
      background: #8d6e63;
      transition: height 0.5s ease;
      z-index: 3;
    }
    #gate-left { left: 200px; height: 250px; }
    #gate-right { left: 490px; height: 250px; }

    /* Trappe / Vanne visuelle sur la porte */
    .valve-hatch {
      position: absolute;
      left: 1px;
      bottom: 10px;
      width: 8px;
      height: 35px;
      background-color: #d84315;
      border: 1px solid #3e2723;
      border-radius: 2px;
      transition: transform 0.4s ease, background-color 0.3s;
    }
    .valve-hatch.open {
      transform: translateY(-30px);
      background-color: #00e676;
    }

    /* Signalétique Lumineuse */
    .traffic-light {
      position: absolute;
      width: 15px;
      height: 35px;
      background: #37474f;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 2px 0;
      z-index: 4;
    }
    .light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #546e7a;
      transition: background-color 0.2s;
    }
    #light-upstream { left: 180px; top: 100px; }
    #light-downstream { left: 510px; top: 220px; }

    .light-red .light-top { background-color: #f44336; box-shadow: 0 0 5px #f44336; }
    .light-green .light-bottom { background-color: #4caf50; box-shadow: 0 0 5px #4caf50; }

    /* Bateau */
    #boat {
      position: absolute;
      width: 80px;
      height: 30px;
      background: #d32f2f;
      border-radius: 0 0 15px 15px;
      transition: left 1s ease, bottom 0.1s linear;
      z-index: 4;
    }
    #boat::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 20px;
      width: 25px;
      height: 10px;
      background: #ffffff;
      border: 1px solid #d32f2f;
    }

    /* Panneau de contrôle */
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      background: #ffffff;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 700px;
    }
    button {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      background-color: #00796b;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background-color: #004d40; }
    button:disabled { background-color: #b0bec5; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>Simulation d'Écluse avec Vannes Visuelles</h2>

  <div id="lock-container">
    <div id="water-upstream" class="water"></div>
    <div id="water-chamber" class="water"></div>
    <div id="water-downstream" class="water"></div>

    <div id="flow-left" class="water-flow"></div>
    <div id="flow-right" class="water-flow"></div>

    <div id="wall-left" class="wall"></div>
    <div id="wall-right" class="wall"></div>

    <div id="gate-left" class="gate">
      <div id="hatch-left" class="valve-hatch" title="Vanne Amont"></div>
    </div>
    <div id="gate-right" class="gate">
      <div id="hatch-right" class="valve-hatch" title="Vanne Aval"></div>
    </div>

    <div id="light-upstream" class="traffic-light light-red">
      <div class="light light-top"></div>
      <div class="light light-bottom"></div>
    </div>
    <div id="light-downstream" class="traffic-light light-red">
      <div class="light light-top"></div>
      <div class="light light-bottom"></div>
    </div>

    <div id="boat" style="left: 50px; bottom: 220px;"></div>
  </div>

  <div class="controls">
    <button id="btn-valve-left">Vanne Amont (Remplir)</button>
    <button id="btn-gate-left" disabled>Porte Amont</button>
    <button id="btn-move-in">Entrer dans le sas</button>
    <button id="btn-move-out">Sortir du sas</button>
    <button id="btn-gate-right" disabled>Porte Aval</button>
    <button id="btn-valve-right">Vanne Aval (Vider)</button>
  </div>

  <script>
    const levelHigh = 220;
    const levelLow = 80;
    let currentChamberLevel = 80;
    let gateLeftOpen = false;
    let gateRightOpen = false;
    let valveLeftOpen = false;
    let valveRightOpen = false;
    let boatPosition = 0;
    let waterInterval = null;

    const chamberWater = document.getElementById('water-chamber');
    const boat = document.getElementById('boat');
    const gateLeft = document.getElementById('gate-left');
    const gateRight = document.getElementById('gate-right');
    const hatchLeft = document.getElementById('hatch-left');
    const hatchRight = document.getElementById('hatch-right');
    const flowLeft = document.getElementById('flow-left');
    const flowRight = document.getElementById('flow-right');
    const lightUpstream = document.getElementById('light-upstream');
    const lightDownstream = document.getElementById('light-downstream');

    function updateBoatHeight() {
      if (boatPosition === 0) boat.style.bottom = levelHigh + 'px';
      else if (boatPosition === 1) boat.style.bottom = currentChamberLevel + 'px';
      else if (boatPosition === 2) boat.style.bottom = levelLow + 'px';
    }

    function updateTrafficLights() {
      if (gateLeftOpen) {
        lightUpstream.classList.remove('light-red');
        lightUpstream.classList.add('light-green');
      } else {
        lightUpstream.classList.remove('light-green');
        lightUpstream.classList.add('light-red');
      }

      if (gateRightOpen) {
        lightDownstream.classList.remove('light-red');
        lightDownstream.classList.add('light-green');
      } else {
        lightDownstream.classList.remove('light-green');
        lightDownstream.classList.add('light-red');
      }
    }

    function toggleValve(side) {
      if (gateLeftOpen || gateRightOpen) return;

      clearInterval(waterInterval);

      if (side === 'left') {
        valveLeftOpen = !valveLeftOpen;
        if (valveLeftOpen) {
          valveRightOpen = false;
          hatchRight.classList.remove('open');
          flowRight.style.display = 'none';
        }
        hatchLeft.classList.toggle('open', valveLeftOpen);
        flowLeft.style.display = valveLeftOpen ? 'block' : 'none';
      } else {
        valveRightOpen = !valveRightOpen;
        if (valveRightOpen) {
          valveLeftOpen = false;
          hatchLeft.classList.remove('open');
          flowLeft.style.display = 'none';
        }
        hatchRight.classList.toggle('open', valveRightOpen);
        flowRight.style.display = valveRightOpen ? 'block' : 'none';
      }

      const targetLevel = valveLeftOpen ? levelHigh : (valveRightOpen ? levelLow : currentChamberLevel);

      if (valveLeftOpen || valveRightOpen) {
        waterInterval = setInterval(() => {
          if (currentChamberLevel < targetLevel) {
            currentChamberLevel += 2;
          } else if (currentChamberLevel > targetLevel) {
            currentChamberLevel -= 2;
          } else {
            clearInterval(waterInterval);
            valveLeftOpen = false;
            valveRightOpen = false;
            hatchLeft.classList.remove('open');
            hatchRight.classList.remove('open');
            flowLeft.style.display = 'none';
            flowRight.style.display = 'none';
          }
          chamberWater.style.height = currentChamberLevel + 'px';
          updateBoatHeight();
          updateButtons();
        }, 30);
      } else {
        updateButtons();
      }
    }

    function toggleGate(side) {
      if (side === 'left') {
        if (currentChamberLevel !== levelHigh || gateRightOpen) return;
        gateLeftOpen = !gateLeftOpen;
        gateLeft.style.height = gateLeftOpen ? '50px' : '250px';
      } else {
        if (currentChamberLevel !== levelLow || gateLeftOpen) return;
        gateRightOpen = !gateRightOpen;
        gateRight.style.height = gateRightOpen ? '50px' : '250px';
      }
      
      updateTrafficLights();
      setTimeout(updateButtons, 550);
    }

    function moveBoat(direction) {
      if (direction === 'in') {
        if (boatPosition === 0 && gateLeftOpen) {
          boatPosition = 1;
          boat.style.left = '310px';
        } else if (boatPosition === 2 && gateRightOpen) {
          boatPosition = 1;
          boat.style.left = '310px';
        }
      } else if (direction === 'out') {
        if (boatPosition === 1 && gateLeftOpen) {
          boatPosition = 0;
          boat.style.left = '50px';
        } else if (boatPosition === 1 && gateRightOpen) {
          boatPosition = 2;
          boat.style.left = '560px';
        }
      }
      updateButtons();
      setTimeout(updateBoatHeight, 500);
    }

    function updateButtons() {
      document.getElementById('btn-gate-left').disabled = (currentChamberLevel !== levelHigh || gateRightOpen || valveLeftOpen || valveRightOpen);
      document.getElementById('btn-gate-right').disabled = (currentChamberLevel !== levelLow || gateLeftOpen || valveLeftOpen || valveRightOpen);

      document.getElementById('btn-valve-left').disabled = (gateLeftOpen || gateRightOpen);
      document.getElementById('btn-valve-right').disabled = (gateLeftOpen || gateRightOpen);

      const canEnterAmont = (boatPosition === 0 && gateLeftOpen);
      const canEnterAval = (boatPosition === 2 && gateRightOpen);
      document.getElementById('btn-move-in').disabled = !(canEnterAmont || canEnterAval);

      const canExitAmont = (boatPosition === 1 && gateLeftOpen);
      const canExitAval = (boatPosition === 1 && gateRightOpen);
      document.getElementById('btn-move-out').disabled = !(canExitAmont || canExitAval);
    }

    // Gestion hybride Souris / Tactile (iPad)
    function attachButtonAction(id, action) {
      const btn = document.getElementById(id);
      
      const handleAction = (e) => {
        if (btn.disabled) return;
        e.preventDefault();
        action();
      };

      btn.addEventListener('pointerdown', handleAction);
      btn.addEventListener('click', (e) => e.preventDefault());
    }

    attachButtonAction('btn-valve-left', () => toggleValve('left'));
    attachButtonAction('btn-gate-left', () => toggleGate('left'));
    attachButtonAction('btn-move-in', () => moveBoat('in'));
    attachButtonAction('btn-move-out', () => moveBoat('out'));
    attachButtonAction('btn-gate-right', () => toggleGate('right'));
    attachButtonAction('btn-valve-right', () => toggleValve('right'));

    updateBoatHeight();
    updateTrafficLights();
    updateButtons();
  </script>
</body>
</html>
